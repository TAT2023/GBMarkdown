[workspace]
members = ["crates/*", "src-tauri"]
default-members = ["crates/gbm-core"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
pulldown-cmark = "0.13"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
