name: Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test --workspace --exclude gbmarkdown
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build
      - name: UI, math, navigation and clipboard regression tests
        shell: pwsh
        run: |
          $gbmServer=Start-Process -FilePath (Get-Command node).Source -ArgumentList 'node_modules/vite/bin/vite.js --host 127.0.0.1' -WindowStyle Hidden -PassThru
          try {
            $gbmReady=$false
            for($gbmAttempt=0;$gbmAttempt -lt 40;$gbmAttempt++){
              try {Invoke-WebRequest 'http://127.0.0.1:1420' -TimeoutSec 1 | Out-Null; $gbmReady=$true; break} catch {Start-Sleep -Milliseconds 500}
            }
            if(!$gbmReady){throw 'Preview server did not start'}
            npm run test:ui
            if($LASTEXITCODE -ne 0){throw 'UI regression failed'}
            npm run test:math
            if($LASTEXITCODE -ne 0){throw 'Math regression failed'}
            npm run test:latex
            if($LASTEXITCODE -ne 0){throw 'LaTeX delimiter regression failed'}
            npm run test:navigation
            if($LASTEXITCODE -ne 0){throw 'Navigation regression failed'}
            npm run test:copy
            if($LASTEXITCODE -ne 0){throw 'Clipboard regression failed'}
            $env:GBM_TEST_RENDER_DELAY_MS='150'
            npm run test:theme
            if($LASTEXITCODE -ne 0){throw 'Theme regression failed'}
          } finally {Stop-Process -Id $gbmServer.Id -ErrorAction SilentlyContinue}
      - run: npm run tauri -- build --bundles nsis
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GBMarkdown-Windows-x64
          path: release/*
